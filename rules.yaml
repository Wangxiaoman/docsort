# docsort 分类路由配置模板
# 使用方法: 复制为 rules.yaml 后按需修改; 路由目标可同时配多项(文件夹+邮件+webhook 并发执行)

ocr:
  backend: rapidocr        # 本机 paddle 2.6.2 首次推理挂起(探针已验证),改用 rapidocr; paddle 备注见 README
  lang: ch
  use_angle_cls: true      # 自动转正横竖页
  dpi: 300
  text_layer_min_chars: 30 # PDF单页文本层达到该字符数则跳过OCR
  cpu_threads: 1           # paddle CPU线程数; macOS 首次推理挂起时保持 1 最稳
  enable_mkldnn: false     # macOS 默认 false(mkldnn 在部分组合下挂起); Linux 可改 true 提速
  show_log: false          # true 可看 paddle 内部日志,便于排查

preprocess:
  enabled: false           # 总开关: false 则跳过全部预处理,图像直接 OCR(命令行 --no-preprocess 可临时关闭)
  max_side: 2000           # 长边超过该值先降采样(性能保护,总开关关闭时仍生效)
  deshadow: false          # 去阴影
  denoise: false           # 去噪(大图最耗时的一步,扫描件噪点少可关闭)
  deskew: true             # 纠偏
  clahe: true              # 对比度增强

classification:
  early_stop: true         # 逐页累计计分,命中即停(不扫全部页)
  max_pages: 3             # 最多识别前几页
  min_margin: 2            # 第一名需领先第二名的分数(安全边际)
  default_threshold: 5     # 模板未单独配置 threshold 时的默认值

routing:
  action: move             # folder 路由时对原文件 move | copy
  on_conflict: rename      # 目标已存在时: rename | skip | overwrite
  failed_folder: ./failed  # 处理异常的文件移入此处; 置空字符串则原地保留
  archive: ""              # 无 folder 路由时的归档目录(watch模式建议配置)
  mail:                    # 邮件路由的公共配置
    host: smtp.example.com
    port: 465
    use_ssl: true
    user: docsort@example.com
    password: ""           # 建议留空,用环境变量: password_env 指定的变量名
    password_env: DOCSORT_SMTP_PASS
    from_name: 文档识别服务

audit:
  log: ./audit/docsort.jsonl

# ── 分类模板 ──────────────────────────────────────────────
templates:
  invoice:
    rules:
      - { pattern: "发票", weight: 3 }
      - { pattern: "发票号码", weight: 3 }
      - { pattern: "(?<!\\d)\\d{20}(?!\\d)", weight: 2 }
      - { pattern: "增值税", weight: 2 }
      - { pattern: "价税合计", weight: 2 }
      - { pattern: "税率|税额", weight: 1 }
    threshold: 5
    route:
      folder: "{output_dir}/发票/{yyyy}-{MM}/{filename}"
      # email:
      #   to: finance@company.com
      #   subject: "收到发票: {filename}"
      # webhook:
      #   url: "http://erp.internal/api/vouchers"
      #   method: POST
      #   timeout: 10

  contract:
    rules:
      - { pattern: "合同|协议书", weight: 3 }
      - { pattern: "甲方", weight: 2 }
      - { pattern: "乙方", weight: 2 }
      - { pattern: "第[一二三四五六七八九十百\\d]+条", weight: 2 }
      - { pattern: "签字|盖章", weight: 1 }
    threshold: 5
    route:
      folder: "{output_dir}/合同/{yyyy}/{filename}"

  idcard:
    rules:
      - { pattern: "居民身份证", weight: 3 }
      - { pattern: "公民身份号码", weight: 3 }
      - { pattern: "(?<!\\d)\\d{17}[0-9Xx](?!\\d)", weight: 3 }
      - { pattern: "性别|民族", weight: 1 }
      - { pattern: "住址", weight: 1 }
    threshold: 6
    route:
      folder: "{output_dir}/身份证/{filename}"

  businesscard:
    rules:
      - { pattern: "手机", weight: 1 }
      - { pattern: "电话", weight: 1 }
      - { pattern: "1[3-9]\\d{9}", weight: 3 }
      - { pattern: "[\\w.+-]+@[\\w-]+\\.[\\w.]+", weight: 2 }
      - { pattern: "总经理|经理|主管|工程师|总监|顾问|销售|市场", weight: 2 }
    threshold: 4
    route:
      folder: "{output_dir}/名片/{filename}"

  # 未达到任何阈值 → 进入待人工目录
  unknown:
    route:
      folder: "{output_dir}/待人工/{filename}"
